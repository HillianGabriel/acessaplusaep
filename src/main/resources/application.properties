# Padrão do XAMPP: MariaDB/MySQL em localhost:3306, usuário root sem senha.
# Para outro ambiente, defina as variáveis DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/acessamais}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# O schema é criado pelo script /database/schema.sql (não pelo Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
